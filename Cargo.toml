[package]
name = "calibre-web"
version = "0.1.0"
edition = "2021"
description = "Ebook web library/reader — orca service-backend"

[package.metadata.orca]
category = "media"

[lib]
name = "calibre_web"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "calibre-web"
path = "src/main.rs"

[dependencies]
plugin-toolkit = { version = "=0.2.1-rc.47", registry = "gitea", package = "orca-plugin-toolkit", default-features = false, features = ["tools", "db", "delegated-http"] }
base64 = "0.22"
roxmltree = "0.20"

[dev-dependencies]
plugin-toolkit = { version = "=0.2.1-rc.47", registry = "gitea", package = "orca-plugin-toolkit", default-features = false, features = ["testing"] }
tokio = { version = "1", features = ["rt"] }

[lints.clippy]
let_underscore_must_use = "deny"
